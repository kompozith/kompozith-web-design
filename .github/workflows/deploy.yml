name: Deploy to VPS

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /var/www/prod/kompozith-web"
          rsync -az --delete \
            dist server package.json package-lock.json tsconfig.json \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/prod/kompozith-web/

      - name: Install dependencies and restart
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd /var/www/prod/kompozith-web &&
            npm ci &&
            chown -R www-data:www-data /var/www/prod/kompozith-web &&
            systemctl restart kompozith-web &&
            sleep 3 &&
            curl -fsS http://127.0.0.1:3001/ >/dev/null
          "
