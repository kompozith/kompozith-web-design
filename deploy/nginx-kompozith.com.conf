server {
    server_name kompozith.com www.kompozith.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript image/svg+xml;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kompozith.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kompozith.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.kompozith.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = kompozith.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name kompozith.com www.kompozith.com;
    listen 80;
    return 404; # managed by Certbot
}
